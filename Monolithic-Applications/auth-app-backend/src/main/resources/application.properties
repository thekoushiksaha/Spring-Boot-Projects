spring.application.name=auth-app-backend

spring.datasource.url=jdbc:mysql://localhost:3306/auth_app_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

security.jwt.secret=${JWT_SECRET:mysecretkey123mysecretkey123myseclkjlkjljretkey123mysecretkey123mysecretkey123mysecretkey123}
security.jwt.issuer=${JWT_ISSUER:api.koushik.com}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}

security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost}

# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google_c_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google_c_secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github_c_id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github_c_secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email